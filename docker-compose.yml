version: '3.8'

services:
  onec-debug-mcp:
    build: .
    container_name: onec-debug-mcp
    restart: unless-stopped
    ports:
      - "8080:8080"
    extra_hosts:
      # Позволяет контейнеру обращаться к хостовому серверу отладки 1C (dbgs.exe)
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
