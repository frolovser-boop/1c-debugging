[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-debug"
version = "1.0.0"
description = "Автономная отладка 1С:Предприятия без Конфигуратора и MCP-сервер для AI-агентов"
readme = "README.md"
authors = [{ name = "frolovser-boop" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["1c", "onec", "debugging", "rdbg", "mcp", "ai", "hermes"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Software Development :: Debuggers",
]

[project.scripts]
onec-debug = "onec_debug.cli:main"

[tool.setuptools.packages.find]
include = ["onec_debug*"]
